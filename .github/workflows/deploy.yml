name: Deploy to GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # If GITHUB_TOKEN lacks permission, create a Personal Access Token (repo scope)
          # and save it as the `GH_PAGES_PAT` secret in your repository settings.
          # The action will prefer `personal_token` when provided.
          personal_token: ${{ secrets.GH_PAGES_PAT }}
          publish_dir: ./dist
